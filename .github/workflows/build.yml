name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ------------------------------------------------------------------ #
  #  Lightweight builds – tiny binaries that use system yt-dlp + ffmpeg  #
  # ------------------------------------------------------------------ #
  build-lightweight:
    name: Lightweight · ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w" \
            -trimpath \
            -o "dist/streamline-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: streamline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  #  Bundled / portable builds – embeds yt-dlp + ffmpeg                #
  # ------------------------------------------------------------------ #
  build-bundled:
    name: Bundled · ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ytdlp: yt-dlp_linux
            ffmpeg_url: "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz"
            ffmpeg_archive: "ffmpeg.tar.xz"
            ffmpeg_bin: "ffmpeg-master-latest-linux64-gpl/bin/ffmpeg"
            ext: ""
          - goos: linux
            goarch: arm64
            ytdlp: yt-dlp_linux_aarch64
            ffmpeg_url: "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linuxarm64-gpl.tar.xz"
            ffmpeg_archive: "ffmpeg.tar.xz"
            ffmpeg_bin: "ffmpeg-master-latest-linuxarm64-gpl/bin/ffmpeg"
            ext: ""
          - goos: windows
            goarch: amd64
            ytdlp: yt-dlp.exe
            ffmpeg_url: "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
            ffmpeg_archive: "ffmpeg.zip"
            ffmpeg_bin: "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe"
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ytdlp: yt-dlp_macos
            ffmpeg_url: "https://evermeet.cx/ffmpeg/getrelease/zip"
            ffmpeg_archive: "ffmpeg.zip"
            ffmpeg_bin: "ffmpeg"
            ext: ""
          - goos: darwin
            goarch: arm64
            ytdlp: yt-dlp_macos
            ffmpeg_url: "https://evermeet.cx/ffmpeg/getrelease/zip"
            ffmpeg_archive: "ffmpeg.zip"
            ffmpeg_bin: "ffmpeg"
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download yt-dlp
        run: |
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/${{ matrix.ytdlp }}" -o yt-dlp
          chmod +x yt-dlp

      - name: Download ffmpeg
        run: |
          curl -fsL "${{ matrix.ffmpeg_url }}" -o ${{ matrix.ffmpeg_archive }}
          if [[ "${{ matrix.ffmpeg_archive }}" == *.zip ]]; then
            unzip -q ${{ matrix.ffmpeg_archive }}
          else
            tar -xf ${{ matrix.ffmpeg_archive }}
          fi
          if [[ "${{ matrix.ffmpeg_bin }}" != "ffmpeg" ]]; then
            cp "${{ matrix.ffmpeg_bin }}" ffmpeg
          fi
          chmod +x ffmpeg

      - name: Build bundled binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build \
            -tags bundled \
            -ldflags="-s -w" \
            -trimpath \
            -o "dist/streamline-${{ matrix.goos }}-${{ matrix.goarch }}-bundled${{ matrix.ext }}" \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: streamline-${{ matrix.goos }}-${{ matrix.goarch }}-bundled
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  #  GitHub Release – fires on every push to master (not PRs)          #
  # ------------------------------------------------------------------ #
  release:
    name: GitHub Release
    needs: [build-lightweight, build-bundled]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
